# ColheAi - API (GS 2026/2 - Domain Driven Design Using Java)
# Since Young - 1TDSPV-2026
#
# Nenhuma credencial fica neste arquivo. Os valores vem de variaveis de
# ambiente: no IntelliJ (Run > Edit Configurations > Environment variables)
# e no Render (Environment). Os nomes estao no README.

spring.application.name=colheai-api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# O Oracle da FIAP limita as sessoes abertas por usuario. Um pool pequeno
# deixa espaco para o SQL Developer e para a API rodando no Render ao mesmo tempo.
spring.datasource.hikari.maximum-pool-size=3

# Campos nulos nao aparecem no JSON de resposta (ex.: "campos" no erro que
# nao e de validacao, ou a chamada que vem so com o id dentro de um item).
spring.jackson.default-property-inclusion=non_null

# O Jackson 3 (Spring Boot 4) ordena as chaves do JSON em ordem alfabetica.
# Desligado para o JSON sair na ordem dos atributos do DTO (id primeiro).
spring.jackson.mapper.sort-properties-alphabetically=false

# No Render a porta vem da variavel PORT; na maquina local, 8080.
server.port=${PORT:8080}

# O Render recebe o HTTPS e repassa para a API em HTTP, avisando nos cabecalhos
# X-Forwarded-*. Com isso o Location do 201 sai com https:// e o dominio publico.
server.forward-headers-strategy=framework
